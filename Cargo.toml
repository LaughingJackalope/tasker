[package]
name = "tasker"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
dashmap = "6.0"
rmp-serde = "1.3"
rmpv = { version = "1.0", features = ["with-serde"] }
bytes = "1.7"
crc32fast = "1.3"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2.0"
tracing = "0.1"
rand = "0.9"

[dev-dependencies]
tempfile = "3.13"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.5"

[[bench]]
name = "throughput"
harness = false
